minimumReleaseAgeExclude:
    - rolldown@1.2.15

overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'
  'typescript': 'npm:typescript-native-bridge@latest'

peerDependencyRules:
  allowAny:
    - 'vue'

# 允许执行安装脚本的依赖（文件监听原生绑定，使用官方预编译产物）
allowBuilds:
  '@parcel/watcher': true
