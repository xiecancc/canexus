name: backend-ci

# 后端回归门禁：补上 .husky/pre-push 注释所指的「完整构建与集成测试由 CI 执行」。
# 本地 pre-commit 负责格式、pre-push 负责编译，本 workflow 额外跑全量 dotnet test
# （API.Tests 需要真实 MySQL，连接串经 SUPER_ADMIN_TEST_CONN 注入隔离测试库）。
on:
  push:
    paths:
      - 'canexus-api-netcore/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'canexus-api-netcore/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: build / format / test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD || 'CiOnlyTest2026' }}
          MYSQL_DATABASE: super_admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

      # DistributedRateLimitApiTests 硬编码 localhost:6379,defaultDatabase=3，
      # 且断言 Redis 必须可达；缺此 service 会让全量 dotnet test 报红。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: canexus-api-netcore

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      SUPER_ADMIN_TEST_CONN: server=127.0.0.1;port=3306;database=super_admin_test;user id=root;password=${{ secrets.TEST_DB_ROOT_PASSWORD || 'CiOnlyTest2026' }};CharSet=utf8mb4;AllowPublicKeyRetrieval=true;SslMode=none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore api.slnx

      # P2-5 / P2-3：交付门禁脚本化 + CI 化，并采集行覆盖率。
      # 四项可验证检查（README 类型引用 / 构建 / 格式 / 全量测试）统一由
      # scripts/verify-delivery.py 执行，与本地 `python scripts/verify-delivery.py` 同源；
      # --ci 跳过工作区干净与 refs 一致检查（CI 为 detached HEAD），--no-restore 复用上一步产物。
      - name: Delivery gate (scripted, with coverage)
        run: python3 scripts/verify-delivery.py --ci --no-restore --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: canexus-api-netcore/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
