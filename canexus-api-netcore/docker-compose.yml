# canexus-api-netcore 一键容器化启动（P1-A5）
# 用法：docker compose up --build
#   拉起 mysql + redis + api（API 启动时自动建库建表、写入迁移基线）
# 定位：本地 / 内网验证。默认以 Staging 环境运行（只强制密钥类基线），
#   生产部署请以 Production 运行并补齐 README「生产环境硬性基线」全部配置
# 多副本限流一致：RateLimit__UseRedis=true，限流计数存 Redis，副本间共享配额
# 必填变量：MYSQL_ROOT_PASSWORD、JWT_SECRET、ADMIN_INITIAL_PASSWORD（在 .env 或环境变量中显式设置，未设置时 compose 直接报错）
name: canexus-api

services:
  mysql:
    image: mysql:8.4
    environment:
      # 必填：未设置时 compose 立即报错，避免硬编码弱口令
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required (set it in .env or environment)}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-super_admin}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Staging}"
      ASPNETCORE_URLS: http://+:8080
      # MySQL（双下划线 = 配置节层级；MySqlConnector 需要的 TLS/字符集参数）
      Database__ConnectionString: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-super_admin};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required};CharSet=utf8mb4;AllowPublicKeyRetrieval=true;SslMode=none;"
      Database__MigrationsEnabled: "true"
      # 全新库首次部署的一次性建表授权（Production 禁止自动改表，未显式授权时首次启动会 fail-fast）：
      # 默认 false（存量库部署安全基线，结构由迁移通道管理）；全新库部署在 .env 设 ALLOW_SCHEMA_INIT=true
      # 并于建表完成后移除（P2-D5：由硬编码 true 改为显式开关，避免生产长期保留「缺表即自动建表」授权）
      Database__AllowSchemaInitialization: "${ALLOW_SCHEMA_INIT:-false}"
      # Jwt 密钥：必填，生产必须通过 .env / 密钥管理系统注入（未设置时 compose 立即报错）
      Jwt__Secret: "${JWT_SECRET:?JWT_SECRET is required (at least 32 random characters)}"
      # 内置超管初始口令：非 Development 环境必填，首次登录后强制修改
      Bootstrap__AdminInitialPassword: "${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required (initial password for built-in admin)}"
      Bootstrap__RequirePasswordChangeOnSeed: "true"
      # 多租户开关须显式声明（默认关闭）
      MultiTenancy__Enabled: "false"
      # 双层缓存：Redis 作为 L2 分布式缓存
      Cache__RedisEnabled: "true"
      Cache__RedisConfiguration: "redis:6379"
      Cache__InstanceName: "super-admin:"
      # 分布式限流：Redis 原子计数，多副本共享配额（P1-A5）
      # 连接串复用 Cache__RedisConfiguration（单一来源）；RateLimit 未显式配置时自动回退，无需重复声明
      RateLimit__Enabled: "true"
      RateLimit__UseRedis: "true"
      RateLimit__RedisKeyPrefix: "super-admin:rl:"
      # 领域事件 Outbox（P1-A2）：生产启用，独立 worker 投递
      Outbox__Enabled: "true"
      # 可观测性（可选）：需要链路追踪 / 指标时在 .env 设置 OTEL_ENABLED=true 与 OTEL_OTLPENDPOINT（OTLP gRPC 端点）
      Otel__Enabled: "${OTEL_ENABLED:-false}"
      Otel__OtlpEndpoint: "${OTEL_OTLPENDPOINT:-}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
